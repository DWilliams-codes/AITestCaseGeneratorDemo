name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Agent and evaluation harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate orchestration, skills, documentation, and eval fixtures
        run: bash scripts/verify.sh --harness-only
      - name: Check patch whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" == "$zero_sha" ]]; then
              empty_tree="$(git hash-object -t tree /dev/null)"
              git diff --check "$empty_tree" "$CURRENT_SHA"
            else
              git diff --check "$PUSH_BEFORE_SHA..$CURRENT_SHA"
            fi
          else
            echo "Unsupported event for patch validation: $EVENT_NAME" >&2
            exit 1
          fi
      - name: Parse PowerShell verification wrapper without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/verify.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile, test, format, analyze, and check coverage
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Check formatting
        working-directory: frontend
        run: npm run format:check
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests and coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Production build
        working-directory: frontend
        run: npm run build

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set OWASP cache date
        id: owasp_cache_date
        shell: bash
        run: date -u +"utc_date=%Y-%m-%d" >> "$GITHUB_OUTPUT"
      - name: Restore OWASP dependency data
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-dependency-check-12.2.2-${{ steps.owasp_cache_date.outputs.utc_date }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-12.2.2-
      - name: Backend dependency scan
        id: backend_dependency_scan
        continue-on-error: true
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress -Psecurity org.owasp:dependency-check-maven:check
      - name: Save OWASP dependency data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-dependency-check-12.2.2-${{ steps.owasp_cache_date.outputs.utc_date }}
      - name: Frontend dependency scan
        working-directory: frontend
        run: npm run audit:ci
      - name: Enforce backend dependency scan result
        if: always() && steps.backend_dependency_scan.outcome == 'failure'
        run: exit 1

  secret-scan:
    name: Repository secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan Git history and working tree with Gitleaks
        run: >-
          docker run --rm --volume "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          git /repo --config /repo/.gitleaks.toml --redact --no-banner

  container-security:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build release containers
        run: |
          docker build --tag testforge-backend:${{ github.sha }} ./backend
          docker build --tag testforge-frontend:${{ github.sha }} ./frontend
      - name: Scan backend container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: testforge-backend:${{ github.sha }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Scan frontend container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: testforge-frontend:${{ github.sha }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: '1'

  end-to-end:
    name: Docker end-to-end and accessibility
    runs-on: ubuntu-latest
    needs: [backend, frontend, secret-scan, harness]
    env:
      POSTGRES_PASSWORD: ci-only-randomized-test-value
      JWT_ACCESS_TOKEN_SECRET: Y2ktb25seS10ZXN0Zm9yZ2Utc2lnbmluZy1rZXktMzItYnl0ZS1taW5pbXVtLTIwMjY=
      TESTFORGE_DEMO_SEED_ENABLED: true
      OPENAI_API_KEY: ci-startup-only-live-generation-is-excluded
      AUTH_ATTEMPTS_PER_MINUTE: 100
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start application
        run: docker compose up --build --detach --wait
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run deterministic Playwright checks
        working-directory: frontend
        run: npm run e2e
      - name: Capture container logs after failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop application
        if: always()
        run: docker compose down --volumes
