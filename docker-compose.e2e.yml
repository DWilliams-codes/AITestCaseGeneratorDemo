services:
  frontend:
    depends_on: !reset {}
    networks:
      - edge
      - data
    volumes:
      - ./frontend/e2e/nginx.fixture.conf:/etc/nginx/conf.d/default.conf:ro

  responses-stub:
    build:
      context: ./frontend/e2e/stub
    network_mode: service:frontend
    depends_on:
      frontend:
        condition: service_started

  backend:
    network_mode: service:frontend
    networks: !reset []
    environment:
      SERVER_ADDRESS: 127.0.0.1
      SERVER_PORT: 8082
      TESTFORGE_DEMO_FIXTURE_MODE: true
      TESTFORGE_DEMO_SEED_ENABLED: true
      TEST_GENERATION_PROVIDER: openai
      OPENAI_API_KEY: synthetic-e2e-only
      OPENAI_BASE_URL: http://127.0.0.1:8081/v1
      OPENAI_MODEL: testforge-review-fixture
      # Disposable parallel browser setup does not exercise abuse rate limits.
      AUTH_ATTEMPTS_PER_MINUTE: 100
      GENERATION_ATTEMPTS_PER_MINUTE: 100
    depends_on:
      frontend:
        condition: service_started
      postgres:
        condition: service_healthy
      responses-stub:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8082/actuator/health/readiness"]
