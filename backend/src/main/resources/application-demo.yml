spring:
  datasource:
    url: jdbc:h2:file:./data/testforge-demo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS testforge
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

testforge:
  auth:
    issuer: testforge-demo
    access-token-secret: VGVzdEZvcmdlLWRlbW8tb25seS1zaWduaW5nLWtleS0zMi1ieXRlcy1taW5pbXVt
    access-token-ttl: PT10M
    refresh-token-ttl: P7D
    secure-cookies: false
    refresh-cookie-name: testforge_refresh
  generation:
    provider: fake
    maximum-cases: 25
    maximum-steps-per-case: 30
  demo:
    seed-enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
