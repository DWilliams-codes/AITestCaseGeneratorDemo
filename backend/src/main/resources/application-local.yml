logging:
  level:
    root: INFO
    com.testforge: INFO

testforge:
  auth:
    secure-cookies: false
    refresh-cookie-name: testforge_refresh
  security:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
    trusted-proxy-cidrs:
      - 127.0.0.1/32
      - ::1/128
